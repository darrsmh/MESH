
; ================================================================
; PlatformIO Configuration
; IoT Multi-Node Seismic Detection System
; Hardware : LilyGO T3-S3 (ESP32-S3 + SX1262 LoRa on-board)
; Cloud    : Vercel (Next.js dashboard + API routes)
; ================================================================

[platformio]
default_envs = sensor_node
src_dir = .

[env_base]
build_src_filter = +<*.cpp> -<node_modules/**>
platform   = espressif32
board      = esp32-s3-devkitc-1
framework  = arduino
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time, colorize
upload_speed    = 921600
lib_deps =
    jgromes/RadioLib @ ^6.4.0
    adafruit/Adafruit MPU6050 @ ^2.2.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    adafruit/Adafruit BusIO @ ^1.14.1
    bblanchon/ArduinoJson @ ^6.21.3
board_build.partitions = default_16MB.csv
board_build.flash_mode = dio
board_build.flash_freq = 80m

; ── SENSOR NODE — flash to boards 1, 2, 3, 4 ──────────────────
; Change -DNODE_ID= before each flash (1 / 2 / 3 / 4)
[env:sensor_node]
extends = env_base
build_flags =
    -O2
    -DNODE_ROLE=0
    -DNODE_ID=1
    -DCORE_DEBUG_LEVEL=3
; ── GATEWAY NODE — flash once to the gateway board ─────────────
[env:gateway_node]
extends = env_base
build_flags =
    -O2
    -DNODE_ROLE=1
    -DNODE_ID=0
    -DCORE_DEBUG_LEVEL=3
